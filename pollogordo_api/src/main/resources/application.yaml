spring:
  application:
    name: pollogordo_api

  datasource:
    url: "${DB_URL}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    context-path: /pollogordo_api
  port: 8083

storage:
  location: ./images

app:
  pagos:
    evidencias-dir: ./uploads/pagos

security:
  jwt:
    secret-key: "${JWT_SECRET}"
    expiration-time: 28800000