
spring:
  application:
    name: pollogordo_api

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: POLLOGORDO_BD
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  servlet:
    context-path: /pollogordo_api
  port: 8083

storage:
  location: ./images
